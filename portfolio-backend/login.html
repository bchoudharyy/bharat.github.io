<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 font-sans">
    <div class="mx-auto flex min-h-screen max-w-3xl flex-col justify-center px-6 py-12">
        <div class="rounded-3xl border border-slate-700 bg-slate-900/95 p-10 shadow-2xl shadow-slate-950/40">
            <h1 class="text-3xl font-bold text-white">Portfolio Admin Login</h1>
            <p class="mt-3 text-slate-400">Enter your admin passcode to access the content editor.</p>

            <form id="loginForm" class="mt-8 space-y-6">
                <div>
                    <label for="secretInput" class="block text-sm font-medium text-slate-300">Admin passcode</label>
                    <input id="secretInput" type="password" autocomplete="current-password" required class="mt-2 block w-full rounded-2xl border border-slate-700 bg-slate-950 px-4 py-3 text-slate-100 outline-none focus:border-neonBlue focus:ring-2 focus:ring-neonBlue/20" />
                </div>
                <button type="submit" class="w-full rounded-full bg-neonBlue px-6 py-3 text-sm font-semibold text-slate-950 transition hover:bg-slate-100">Sign in</button>
                <p id="loginStatus" class="text-sm text-slate-400"></p>
            </form>

            <div class="mt-8 rounded-2xl border border-slate-700 bg-slate-950/80 p-4 text-sm text-slate-400">
                <p>After successful login, you will be redirected to the admin editor.</p>
                <p class="mt-2">If you don’t have the passcode, open <span class="font-mono text-slate-200">.env</span> in the backend folder and set <code class="rounded bg-slate-800 px-2 py-1">ADMIN_SECRET</code>.</p>
            </div>
        </div>
    </div>

    <script src="/login.js"></script>
</body>
</html>
